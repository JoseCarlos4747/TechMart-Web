<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechMart</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js"></script>
    <link rel="icon" type="image/png" href="Imagen1.png">
</head>
<body>
        <!-----------LOGIN USUARUIO--------->
    <div id="Logincito">
        <div class="logo">🛒 TechMart</div>
        <h2>Iniciar sesion</h2>
        <form action="" id="formulariodelogin">
            <div class="grupo1">
                <label for="">Correo Electronico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="grupo1">
                <label for="">Contraseña: </label>
                <input type="password"  id="password" required placeholder="Minimo 6 caracteres">
            </div>
            <div class="ERROR" id="mensaje"></div>
            <button type="submit" class="botonlogin" >Ingresar</button>
            <a href="index.html" class="botonvolver">Volver a la tienda</a>
        </form>
    </div>
</body>
</html>
