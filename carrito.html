<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito de Compras - TechMart</title>
    <link rel="icon" type="image/png" href="Imagen1.png" />
    <link rel="stylesheet" href="carrito.css" />
  </head>
  <body>
    <div id="encabezado">
      <h3>TechMart S.A.C.</h3>
      <nav id="e1">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="carrito.html">Carrito Compras</a></li>
          <li><a href="pagos.html">Pagos</a></li>
          <li><a href="ayuda.html">Ayuda</a></li>
        </ul>
      </nav>

      <nav id="e2">
        <ul>
          <li><a href="">Log In</a></li>
          <li><a href="">Log Out</a></li>
        </ul>
      </nav>
    </div>

    <div class="container">
      <h1>Tu Carrito de Compras</h1>

      <div id="carrito-vacio" class="mensaje-vacio">
        <p>Tu carrito está vacío</p>
        <a href="productos.html" class="btn">Ir a Productos</a>
      </div>

      <div id="carrito-contenido" class="carrito-contenido">
        <div class="carrito-items">
          <!-- Los productos se agregarán dinámicamente aquí -->
        </div>

        <div class="resumen-compra">
          <h3>Resumen de Compra</h3>
          <div class="resumen-detalle">
            <div class="resumen-linea">
              <span>Subtotal:</span>
              <span id="subtotal">S/ 0.00</span>
            </div>
            <div class="resumen-linea">
              <span>Envío:</span>
              <span id="envio">S/ 0.00</span>
            </div>
            <div class="resumen-linea total">
              <span>Total:</span>
              <span id="total">S/ 0.00</span>
            </div>
          </div>
          <button id="btn-proceder-pago" class="btn btn-principal">
            Proceder al Pago
          </button>
        </div>
      </div>
    </div>

    <script src="js/carrito.js"></script>
  </body>
</html>
